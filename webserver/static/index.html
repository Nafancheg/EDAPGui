<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ED Autopilot - Headless</title>
<style>
  :root { --amber:#ffb000; --amber-dim:#a06e00; --green:#00c800; --bg:#000; }
  * { box-sizing: border-box; }
  body {
    margin:0; background:var(--bg); color:var(--amber);
    font-family: "Consolas","Courier New",monospace; font-size:14px;
    padding:10px;
  }
  h1 { font-size:16px; margin:0 0 8px; letter-spacing:2px; }
  #conn { font-size:12px; color:var(--amber-dim); }
  #conn.up { color:var(--green); }
  #apstatus { border:1px solid var(--amber-dim); padding:6px 8px; margin:8px 0; }
  .cols { display:flex; gap:12px; flex-wrap:wrap; }
  .panel { border:1px solid var(--amber-dim); padding:8px; flex:1; min-width:280px; }
  .panel h2 { font-size:13px; margin:0 0 6px; color:var(--amber-dim); letter-spacing:1px; }
  #status table { width:100%; border-collapse:collapse; }
  #status td { padding:1px 4px; vertical-align:top; }
  #status td.k { color:var(--amber-dim); white-space:nowrap; }
  #log { height:260px; overflow-y:auto; white-space:pre-wrap; word-break:break-word; }
  #log .voice { color:var(--green); }
  #controls { margin:10px 0; }
  #controls .row { margin-bottom:6px; }
  button {
    background:#111; color:var(--amber); border:1px solid var(--amber);
    font-family:inherit; font-size:13px; padding:8px 12px; margin:2px;
    cursor:pointer; min-width:64px; min-height:40px;
  }
  button:hover { background:var(--amber); color:#000; }
  .lbl { color:var(--amber-dim); margin-right:6px; }
</style>
</head>
<body>
  <h1>ED AUTOPILOT &mdash; MCDU (placeholder)</h1>
  <div id="conn">connecting&hellip;</div>
  <div id="apstatus">AP: &mdash;</div>

  <div id="controls">
    <div class="row"><span class="lbl">FSD</span>
      <button data-cmd='{"cmd":"assist.start","mode":"fsd"}'>START</button>
      <button data-cmd='{"cmd":"assist.stop","mode":"fsd"}'>STOP</button>
    </div>
    <div class="row"><span class="lbl">SC&nbsp;</span>
      <button data-cmd='{"cmd":"assist.start","mode":"sc"}'>START</button>
      <button data-cmd='{"cmd":"assist.stop","mode":"sc"}'>STOP</button>
    </div>
    <div class="row"><span class="lbl">THR</span>
      <button data-cmd='{"cmd":"throttle.set","level":0}'>0%</button>
      <button data-cmd='{"cmd":"throttle.set","level":50}'>50%</button>
      <button data-cmd='{"cmd":"throttle.set","level":100}'>100%</button>
    </div>
    <div class="row"><span class="lbl">ALL</span>
      <button data-cmd='{"cmd":"assist.stop_all"}'>STOP ALL</button>
    </div>
  </div>

  <div class="cols">
    <div class="panel" id="statuspanel">
      <h2>STATUS</h2>
      <div id="status">waiting for telemetry&hellip;</div>
    </div>
    <div class="panel">
      <h2>LOG</h2>
      <div id="log"></div>
    </div>
  </div>

<script>
(function(){
  var connEl = document.getElementById('conn');
  var apEl = document.getElementById('apstatus');
  var statusEl = document.getElementById('status');
  var logEl = document.getElementById('log');

  function addLog(text, voice){
    var line = document.createElement('div');
    if (voice) line.className = 'voice';
    line.textContent = text;
    logEl.appendChild(line);
    while (logEl.childNodes.length > 400) logEl.removeChild(logEl.firstChild);
    logEl.scrollTop = logEl.scrollHeight;
  }

  var FIELDS = [
    ['ap_mode','AP MODE'], ['ap_state','AP STATE'],
    ['ship_status','SHIP'], ['fuel_percent','FUEL %'],
    ['location','SYSTEM'], ['star_class','STAR'], ['scoopable','SCOOPABLE'],
    ['target','TARGET'], ['jumps_remaining','JUMPS LEFT'],
    ['jump_cnt','JUMP CNT'], ['total_jumps','TOTAL JUMPS'],
    ['total_dist_jumped','DIST LY'], ['eta','ETA'],
    ['elw_scanner','ELW'], ['edsm_info','EDSM']
  ];
  function renderStatus(d){
    var rows = '';
    FIELDS.forEach(function(f){
      var v = d[f[0]];
      if (v === null || v === undefined) v = '-';
      rows += '<tr><td class="k">'+f[1]+'</td><td>'+String(v)+'</td></tr>';
    });
    statusEl.innerHTML = '<table>'+rows+'</table>';
  }

  function handle(ev){
    switch(ev.type){
      case 'hello': addLog('[connected to server]'); break;
      case 'log': addLog(ev.text, ev.voice); break;
      case 'statusline': apEl.textContent = 'AP: ' + ev.text; break;
      case 'jumpcount': addLog('[jumps] ' + ev.text); break;
      case 'assist':
        addLog('[assist] ' + ev.mode + ' ' + (ev.running?'RUNNING':'stopped'));
        break;
      case 'ship_changed': addLog('[ship changed]'); break;
      case 'status_snapshot': renderStatus(ev.data); break;
      case 'error': addLog('[error] ' + ev.text); break;
      case 'config': addLog('[config] ' + JSON.stringify(ev.data).slice(0,200)+'...'); break;
      default: addLog('[event] ' + JSON.stringify(ev));
    }
  }

  var ws;
  function connect(){
    var proto = (location.protocol === 'https:') ? 'wss:' : 'ws:';
    ws = new WebSocket(proto + '//' + location.host + '/ws');
    ws.onopen = function(){ connEl.textContent = 'connected'; connEl.className = 'up'; };
    ws.onclose = function(){
      connEl.textContent = 'disconnected - retrying'; connEl.className = '';
      setTimeout(connect, 2000);
    };
    ws.onerror = function(){ connEl.textContent = 'error'; };
    ws.onmessage = function(m){
      try { handle(JSON.parse(m.data)); } catch(e){ addLog('[bad msg] '+m.data); }
    };
  }
  connect();

  document.querySelectorAll('button[data-cmd]').forEach(function(b){
    b.addEventListener('click', function(){
      if (ws && ws.readyState === WebSocket.OPEN) ws.send(b.getAttribute('data-cmd'));
      else addLog('[not connected]');
    });
  });
})();
</script>
</body>
</html>
