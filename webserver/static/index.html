<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ED Autopilot — MCDU</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Ubuntu+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/mcdu.css?v=11">
</head>
<body>
<div class="stage">
  <div class="instrument">

    <!-- shield / nameplate -->
    <div class="nameplate">
      <svg class="logo" viewBox="0 0 40 40" width="30" height="30" aria-hidden="true">
        <path d="M20 2 L38 20 L20 38 L2 20 Z" fill="none" stroke="#E8973E" stroke-width="2"/>
        <path d="M20 12 L28 20 L20 28 L12 20 Z" fill="#E8973E"/>
      </svg>
      <div class="brand">EDAP&nbsp;·&nbsp;MCDU</div>
      <div class="conn">
        <span id="connDot" class="dot off"></span>
        <span id="connLabel" class="conn-label">OFFLINE</span>
      </div>
    </div>

    <!-- core: LSK columns + screen -->
    <div id="core" class="core page-init">

      <div class="screen-bg">
        <div class="layer-dots"></div>
        <div class="layer-glint"></div>
      </div>

      <!-- screen title row -->
      <div class="scr-title scol">
        <span id="scrTitle" class="title-text">EDAUTOPILOT</span>
        <span id="scrInd" class="title-ind">INIT</span>
      </div>

      <!-- screen subtitle (AP / MODE) -->
      <div class="scr-sub scol">
        <span id="subL" class="sub-left">AP: ---</span>
        <span id="subR" class="sub-right">MODE ---</span>
      </div>

      <div class="divider div-top scol"></div>

      <!-- 6 data rows -->
      <div class="row scol r1"><div class="row-heads"><span class="lhead"></span><span class="rhead"></span></div><div class="row-vals"><span class="lval"></span><span class="rval"></span></div></div>
      <div class="row scol r2"><div class="row-heads"><span class="lhead"></span><span class="rhead"></span></div><div class="row-vals"><span class="lval"></span><span class="rval"></span></div></div>
      <div class="row scol r3"><div class="row-heads"><span class="lhead"></span><span class="rhead"></span></div><div class="row-vals"><span class="lval"></span><span class="rval"></span></div></div>
      <div class="row scol r4"><div class="row-heads"><span class="lhead"></span><span class="rhead"></span></div><div class="row-vals"><span class="lval"></span><span class="rval"></span></div></div>
      <div class="row scol r5"><div class="row-heads"><span class="lhead"></span><span class="rhead"></span></div><div class="row-vals"><span class="lval"></span><span class="rval"></span></div></div>
      <div class="row scol r6"><div class="row-heads"><span class="lhead"></span><span class="rhead"></span></div><div class="row-vals"><span class="lval"></span><span class="rval"></span></div></div>

      <div class="divider div-bot scol"></div>

      <!-- scratchpad: a real input (typing, clipboard paste, native caret) -->
      <div id="scratch" class="scratchpad scol"><input id="spInput" class="sp-input" type="text" maxlength="22" autocomplete="off" autocapitalize="characters" spellcheck="false" aria-label="scratchpad"></div>

      <!-- LSK left -->
      <button type="button" class="lsk lsk-l l1" data-side="L" data-idx="0" aria-label="LSK L1"><span class="lsk-cap"></span></button>
      <button type="button" class="lsk lsk-l l2" data-side="L" data-idx="1" aria-label="LSK L2"><span class="lsk-cap"></span></button>
      <button type="button" class="lsk lsk-l l3" data-side="L" data-idx="2" aria-label="LSK L3"><span class="lsk-cap"></span></button>
      <button type="button" class="lsk lsk-l l4" data-side="L" data-idx="3" aria-label="LSK L4"><span class="lsk-cap"></span></button>
      <button type="button" class="lsk lsk-l l5" data-side="L" data-idx="4" aria-label="LSK L5"><span class="lsk-cap"></span></button>
      <button type="button" class="lsk lsk-l l6" data-side="L" data-idx="5" aria-label="LSK L6"><span class="lsk-cap"></span></button>

      <!-- LSK right -->
      <button type="button" class="lsk lsk-r r1b" data-side="R" data-idx="0" aria-label="LSK R1"><span class="lsk-cap"></span></button>
      <button type="button" class="lsk lsk-r r2b" data-side="R" data-idx="1" aria-label="LSK R2"><span class="lsk-cap"></span></button>
      <button type="button" class="lsk lsk-r r3b" data-side="R" data-idx="2" aria-label="LSK R3"><span class="lsk-cap"></span></button>
      <button type="button" class="lsk lsk-r r4b" data-side="R" data-idx="3" aria-label="LSK R4"><span class="lsk-cap"></span></button>
      <button type="button" class="lsk lsk-r r5b" data-side="R" data-idx="4" aria-label="LSK R5"><span class="lsk-cap"></span></button>
      <button type="button" class="lsk lsk-r r6b" data-side="R" data-idx="5" aria-label="LSK R6"><span class="lsk-cap"></span></button>
    </div>

    <!-- function keys -->
    <div class="funckeys">
      <!-- row 1: the route cluster sits together (customer decision
           2026-07-13, Замечание 19): DIR · PROG · INIT · F-PLN · RTE PLAN -->
      <button type="button" class="fk" data-key="DIR">DIR</button>
      <button type="button" class="fk" data-key="PROG">PROG<span id="ledProg" class="fk-led"></span></button>
      <button type="button" class="fk" data-key="INIT">INIT</button>
      <button type="button" class="fk" data-key="F-PLN">F-PLN</button>
      <button type="button" class="fk" data-key="RTE PLAN">RTE PLAN</button>
      <button type="button" class="fk" data-key="DATA">DATA</button>
      <button type="button" class="fk" data-key="PERF">PERF</button>
      <button type="button" class="fk" data-key="CRU OPT">CRU OPT</button>
      <button type="button" class="fk" data-key="FUEL PRED">FUEL PRED<span id="ledFuel" class="fk-led"></span></button>
      <button type="button" class="fk" data-key="ATC COMM">ATC COMM</button>
      <button type="button" class="fk" data-key="MCDU MENU">MCDU MENU</button>
      <button type="button" class="fk" data-key="AUTO TUNE">AUTO TUNE</button>
    </div>

    <!-- slew row -->
    <div class="slewrow">
      <!-- AIRPORT has no meaning in ED; repurposed as scratchpad CLR
           (customer decision 2026-07-13, Замечание 19) -->
      <button type="button" class="fk airport" data-slew="clr" aria-label="clear scratchpad">CLR</button>
      <button type="button" class="fk kbdtoggle" id="kbdToggle" aria-label="toggle keypad">KBD</button>
      <button type="button" class="fk clipbtn" id="cpyBtn" aria-label="copy scratchpad to clipboard">CPY</button>
      <button type="button" class="fk clipbtn" id="pstBtn" aria-label="paste clipboard to scratchpad">PST</button>
      <button type="button" class="fk clipbtn" id="pcBtn" aria-label="paste host PC clipboard to scratchpad">PC</button>
      <button type="button" class="slew" data-slew="l" aria-label="slew left">&#8592;</button>
      <button type="button" class="slew" data-slew="u" aria-label="slew up">&#8593;</button>
      <button type="button" class="slew" data-slew="d" aria-label="slew down">&#8595;</button>
      <button type="button" class="slew" data-slew="r" aria-label="slew right">&#8594;</button>
      <div id="estop" class="estop" title="STOP ALL">
        <button type="button" id="estopBtn" class="estop-btn" aria-label="STOP ALL">STOP</button>
        <div id="estopCover" class="estop-cover" role="button" aria-label="lift STOP ALL guard"></div>
      </div>
    </div>

    <!-- on-screen alphanumeric keypad (KBD toggle in the slew row); keys
         feed the scratchpad through the same input filter as real typing -->
    <div id="kbdPanel" class="kbd-panel" hidden>
      <button type="button" class="fk kbd-key" data-ch="1">1</button>
      <button type="button" class="fk kbd-key" data-ch="2">2</button>
      <button type="button" class="fk kbd-key" data-ch="3">3</button>
      <button type="button" class="fk kbd-key" data-ch="4">4</button>
      <button type="button" class="fk kbd-key" data-ch="5">5</button>
      <button type="button" class="fk kbd-key" data-ch="6">6</button>
      <button type="button" class="fk kbd-key" data-ch="7">7</button>
      <button type="button" class="fk kbd-key" data-ch="8">8</button>
      <button type="button" class="fk kbd-key" data-ch="9">9</button>
      <button type="button" class="fk kbd-key" data-ch="0">0</button>
      <button type="button" class="fk kbd-key" data-ch="A">A</button>
      <button type="button" class="fk kbd-key" data-ch="B">B</button>
      <button type="button" class="fk kbd-key" data-ch="C">C</button>
      <button type="button" class="fk kbd-key" data-ch="D">D</button>
      <button type="button" class="fk kbd-key" data-ch="E">E</button>
      <button type="button" class="fk kbd-key" data-ch="F">F</button>
      <button type="button" class="fk kbd-key" data-ch="G">G</button>
      <button type="button" class="fk kbd-key" data-ch="H">H</button>
      <button type="button" class="fk kbd-key" data-ch="I">I</button>
      <button type="button" class="fk kbd-key" data-ch="J">J</button>
      <button type="button" class="fk kbd-key" data-ch="K">K</button>
      <button type="button" class="fk kbd-key" data-ch="L">L</button>
      <button type="button" class="fk kbd-key" data-ch="M">M</button>
      <button type="button" class="fk kbd-key" data-ch="N">N</button>
      <button type="button" class="fk kbd-key" data-ch="O">O</button>
      <button type="button" class="fk kbd-key" data-ch="P">P</button>
      <button type="button" class="fk kbd-key" data-ch="Q">Q</button>
      <button type="button" class="fk kbd-key" data-ch="R">R</button>
      <button type="button" class="fk kbd-key" data-ch="S">S</button>
      <button type="button" class="fk kbd-key" data-ch="T">T</button>
      <button type="button" class="fk kbd-key" data-ch="U">U</button>
      <button type="button" class="fk kbd-key" data-ch="V">V</button>
      <button type="button" class="fk kbd-key" data-ch="W">W</button>
      <button type="button" class="fk kbd-key" data-ch="X">X</button>
      <button type="button" class="fk kbd-key" data-ch="Y">Y</button>
      <button type="button" class="fk kbd-key" data-ch="Z">Z</button>
      <button type="button" class="fk kbd-key" data-ch=".">.</button>
      <button type="button" class="fk kbd-key" data-ch="/">/</button>
      <button type="button" class="fk kbd-key" data-ch="'">'</button>
      <button type="button" class="fk kbd-key" data-ch="*">*</button>
      <button type="button" class="fk kbd-key" data-ch="-">-</button>
      <button type="button" class="fk kbd-key" data-ch="+">+</button>
      <button type="button" class="fk kbd-key kbd-wide" data-ch=" ">SP</button>
      <button type="button" class="fk kbd-key kbd-bs" data-bs="1" aria-label="backspace">&#9003;</button>
    </div>

    <!-- RPY curve editor panel (PERF page) -->
    <div id="curvePanel" class="curve-panel" hidden>
      <div class="curve-panel-head">RPY CURVE EDITOR</div>
      <div class="curve-panel-screen">
        <div class="layer-dots"></div>
        <div id="curveView" class="curve-view"></div>
      </div>
    </div>

    <!-- message log (per mockup's MESSAGE LOG unit) -->
    <div class="logpanel">
      <div class="logpanel-head">MESSAGE LOG</div>
      <div class="logpanel-screen">
        <div class="layer-dots"></div>
        <div id="logView" class="log-view"></div>
      </div>
    </div>

  </div>
</div>
<script src="/static/mcdu_i18n.js?v=5"></script>
<script src="/static/mcdu_curves.js?v=2"></script>
<script src="/static/mcdu.js?v=25"></script>
</body>
</html>
